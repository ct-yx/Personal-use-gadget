<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MD → EPUB 合成工具</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Noto+Serif+SC:wght@400;600&display=swap');

  :root {
    --bg: #0e0e0f;
    --surface: #161618;
    --border: #2a2a2e;
    --accent: #f59e0b;
    --accent2: #ef4444;
    --text: #e8e6e1;
    --muted: #6b6b72;
    --success: #22c55e;
    --mono: 'Space Mono', monospace;
    --serif: 'Noto Serif SC', serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--mono);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* Grid lines background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(245,158,11,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(245,158,11,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  header {
    position: relative;
    z-index: 1;
    border-bottom: 1px solid var(--border);
    padding: 20px 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: rgba(14,14,15,0.9);
    backdrop-filter: blur(8px);
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .logo-mark {
    width: 36px; height: 36px;
    background: var(--accent);
    clip-path: polygon(0 0, 70% 0, 100% 30%, 100% 100%, 30% 100%, 0 70%);
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; font-weight: 700; color: #000;
    flex-shrink: 0;
  }

  h1 {
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 0.1em;
    color: var(--accent);
    text-transform: uppercase;
  }

  .subtitle { font-size: 11px; color: var(--muted); letter-spacing: 0.05em; margin-top: 2px; }

  .status-bar {
    font-size: 11px;
    color: var(--muted);
    display: flex;
    gap: 20px;
    align-items: center;
  }

  .status-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--muted);
    display: inline-block;
    margin-right: 6px;
  }
  .status-dot.active { background: var(--success); box-shadow: 0 0 6px var(--success); }

  main {
    position: relative;
    z-index: 1;
    flex: 1;
    display: grid;
    grid-template-columns: 340px 1fr;
    grid-template-rows: 1fr;
    height: calc(100vh - 73px);
  }

  /* LEFT PANEL */
  .panel-left {
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    background: var(--surface);
    overflow: hidden;
  }

  .panel-title {
    font-size: 10px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--muted);
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .file-count {
    background: var(--accent);
    color: #000;
    font-size: 10px;
    font-weight: 700;
    padding: 2px 7px;
    border-radius: 2px;
    display: none;
  }

  /* Drop zone */
  #dropzone {
    margin: 16px;
    border: 1.5px dashed var(--border);
    border-radius: 4px;
    padding: 24px 16px;
    text-align: center;
    cursor: pointer;
    transition: all 0.2s;
    flex-shrink: 0;
  }

  #dropzone:hover, #dropzone.drag-over {
    border-color: var(--accent);
    background: rgba(245,158,11,0.05);
  }

  #dropzone .dz-icon {
    font-size: 28px;
    margin-bottom: 8px;
  }

  #dropzone .dz-text {
    font-size: 12px;
    color: var(--muted);
    line-height: 1.6;
  }

  #dropzone .dz-text strong { color: var(--accent); }

  #fileInput { display: none; }

  /* File list */
  #fileList {
    flex: 1;
    overflow-y: auto;
    padding: 0 16px 16px;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }

  .file-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 10px;
    border: 1px solid var(--border);
    border-radius: 3px;
    margin-bottom: 6px;
    background: var(--bg);
    cursor: grab;
    transition: all 0.15s;
    user-select: none;
  }

  .file-item:active { cursor: grabbing; }
  .file-item.drag-item { opacity: 0.4; border-color: var(--accent); }
  .file-item.drag-over-item { border-color: var(--accent); background: rgba(245,158,11,0.08); }

  .file-item:hover { border-color: #444; }

  .drag-handle {
    color: var(--muted);
    font-size: 14px;
    flex-shrink: 0;
    cursor: grab;
  }

  .file-info { flex: 1; min-width: 0; }

  .file-name {
    font-size: 12px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    color: var(--text);
  }

  .file-size { font-size: 10px; color: var(--muted); margin-top: 2px; }

  .file-del {
    color: var(--muted);
    background: none;
    border: none;
    cursor: pointer;
    font-size: 16px;
    line-height: 1;
    padding: 2px 4px;
    transition: color 0.15s;
    flex-shrink: 0;
  }
  .file-del:hover { color: var(--accent2); }

  /* Controls at bottom of left panel */
  .controls {
    border-top: 1px solid var(--border);
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    flex-shrink: 0;
    background: var(--surface);
  }

  .input-group {
    display: flex;
    flex-direction: column;
    gap: 5px;
  }

  .input-label {
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .input-row { display: flex; gap: 8px; }

  input[type="text"] {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: var(--mono);
    font-size: 12px;
    padding: 8px 10px;
    border-radius: 3px;
    outline: none;
    transition: border-color 0.15s;
  }
  input[type="text"]:focus { border-color: var(--accent); }

  .sep-select {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: var(--mono);
    font-size: 12px;
    padding: 8px 10px;
    border-radius: 3px;
    outline: none;
    width: 100%;
    transition: border-color 0.15s;
    cursor: pointer;
  }
  .sep-select:focus { border-color: var(--accent); }

  .checkbox-row {
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
  }

  .checkbox-row input[type="checkbox"] {
    accent-color: var(--accent);
    width: 14px; height: 14px;
    cursor: pointer;
  }

  .checkbox-label { font-size: 12px; color: var(--muted); cursor: pointer; }
  .checkbox-row:hover .checkbox-label { color: var(--text); }

  .btn {
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    border: none;
    cursor: pointer;
    padding: 11px 16px;
    border-radius: 3px;
    transition: all 0.15s;
    width: 100%;
  }

  .btn-primary {
    background: var(--accent);
    color: #000;
  }
  .btn-primary:hover { background: #fbbf24; transform: translateY(-1px); }
  .btn-primary:active { transform: translateY(0); }
  .btn-primary:disabled { background: #444; color: var(--muted); cursor: not-allowed; transform: none; }

  .btn-secondary {
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--border);
  }
  .btn-secondary:hover { border-color: var(--text); color: var(--text); }

  .btn-row { display: flex; gap: 8px; }
  .btn-row .btn { flex: 1; }

  /* RIGHT PANEL */
  .panel-right {
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .panel-tabs {
    display: flex;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    flex-shrink: 0;
  }

  .tab {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    padding: 14px 20px;
    background: none;
    border: none;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
    transition: all 0.15s;
  }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }

  .tab-content {
    flex: 1;
    overflow: hidden;
    display: none;
  }
  .tab-content.active { display: flex; flex-direction: column; }

  /* Preview */
  #previewArea {
    flex: 1;
    overflow-y: auto;
    padding: 40px 60px;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }

  .preview-empty {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    color: var(--muted);
    text-align: center;
    gap: 16px;
  }

  .preview-empty .big-icon { font-size: 48px; opacity: 0.3; }
  .preview-empty p { font-size: 12px; line-height: 1.8; }

  /* Rendered HTML preview */
  .prose {
    max-width: 680px;
    margin: 0 auto;
    font-family: var(--serif);
    font-size: 16px;
    line-height: 1.85;
    color: #d4d0c9;
  }

  .prose h1, .prose h2, .prose h3 {
    font-family: var(--serif);
    color: var(--accent);
    margin: 2em 0 0.8em;
    line-height: 1.4;
  }
  .prose h1 { font-size: 1.8em; }
  .prose h2 { font-size: 1.4em; border-bottom: 1px solid var(--border); padding-bottom: 0.4em; }
  .prose h3 { font-size: 1.15em; }
  .prose p { margin-bottom: 1.2em; }
  .prose code {
    background: rgba(245,158,11,0.12);
    color: var(--accent);
    padding: 2px 6px;
    border-radius: 3px;
    font-family: var(--mono);
    font-size: 0.85em;
  }
  .prose pre {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 16px;
    overflow-x: auto;
    margin: 1.5em 0;
  }
  .prose pre code { background: none; padding: 0; color: #98c4ab; }
  .prose blockquote {
    border-left: 3px solid var(--accent);
    margin: 1.5em 0;
    padding: 0.5em 1.2em;
    color: var(--muted);
    font-style: italic;
  }
  .prose ul, .prose ol { margin: 1em 0 1em 1.5em; }
  .prose li { margin-bottom: 0.4em; }
  .prose table { width: 100%; border-collapse: collapse; margin: 1.5em 0; font-size: 0.9em; }
  .prose th { background: rgba(245,158,11,0.12); padding: 8px 12px; text-align: left; border-bottom: 1px solid var(--border); color: var(--accent); }
  .prose td { padding: 8px 12px; border-bottom: 1px solid var(--border); }
  .prose hr { border: none; border-top: 1px solid var(--border); margin: 2em 0; }
  .prose a { color: var(--accent); }
  .prose img { max-width: 100%; border-radius: 4px; }

  .chapter-divider {
    text-align: center;
    padding: 24px 0;
    color: var(--muted);
    font-size: 11px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 24px 0;
  }
  .chapter-divider::before, .chapter-divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  /* Raw text tab */
  #rawArea {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }

  #rawText {
    width: 100%;
    height: 100%;
    background: var(--bg);
    color: #98c4ab;
    border: 1px solid var(--border);
    border-radius: 4px;
    font-family: var(--mono);
    font-size: 12px;
    padding: 20px;
    resize: none;
    outline: none;
    line-height: 1.7;
    tab-size: 2;
  }

  /* Toast */
  #toast {
    position: fixed;
    bottom: 24px;
    right: 24px;
    background: var(--surface);
    border: 1px solid var(--accent);
    color: var(--accent);
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.05em;
    padding: 12px 20px;
    border-radius: 4px;
    z-index: 9999;
    transform: translateY(80px);
    opacity: 0;
    transition: all 0.3s cubic-bezier(.16,1,.3,1);
    display: flex;
    align-items: center;
    gap: 10px;
    max-width: 360px;
  }
  #toast.show { transform: translateY(0); opacity: 1; }
  #toast.error { border-color: var(--accent2); color: var(--accent2); }
  #toast.success { border-color: var(--success); color: var(--success); }

  /* Progress bar */
  #progressBar {
    position: fixed;
    top: 0;
    left: 0;
    height: 2px;
    background: var(--accent);
    z-index: 9999;
    transition: width 0.3s ease;
    display: none;
    box-shadow: 0 0 8px var(--accent);
  }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: #444; }

  /* Responsive */
  @media (max-width: 768px) {
    main { grid-template-columns: 1fr; grid-template-rows: auto 1fr; height: auto; min-height: calc(100vh - 73px); }
    .panel-left { max-height: 60vh; }
    #previewArea { padding: 24px 20px; }
  }

  .file-num {
    font-size: 10px;
    color: var(--muted);
    width: 18px;
    text-align: right;
    flex-shrink: 0;
  }
</style>
</head>
<body>

<div id="progressBar"></div>

<header>
  <div class="logo">
    <div class="logo-mark">MD</div>
    <div>
      <h1>MD → EPUB 合成器</h1>
      <div class="subtitle">Markdown Document Merger &amp; EPUB Exporter</div>
    </div>
  </div>
  <div class="status-bar">
    <span><span class="status-dot active" id="statusDot"></span><span id="statusText">就绪</span></span>
  </div>
</header>

<main>
  <!-- LEFT PANEL -->
  <div class="panel-left">
    <div class="panel-title">
      <span>文件队列</span>
      <span class="file-count" id="fileCount">0</span>
    </div>

    <div id="dropzone" onclick="document.getElementById('fileInput').click()">
      <div class="dz-icon">⊕</div>
      <div class="dz-text">
        <strong>点击或拖拽</strong>添加 .md 文件<br>
        支持批量导入，可拖拽排序
      </div>
    </div>
    <input type="file" id="fileInput" accept=".md,.markdown,.txt" multiple>

    <div id="fileList"></div>

    <div class="controls">
      <div class="input-group">
        <div class="input-label">书籍标题</div>
        <input type="text" id="bookTitle" placeholder="请输入书名" value="我的电子书">
      </div>
      <div class="input-group">
        <div class="input-label">作者</div>
        <input type="text" id="bookAuthor" placeholder="作者名称" value="">
      </div>
      <div class="input-group">
        <div class="input-label">章节分隔方式</div>
        <select class="sep-select" id="chapterMode">
          <option value="file">每个文件为一章</option>
          <option value="h1">按一级标题 (# 标题) 分章</option>
          <option value="h2">按二级标题 (## 标题) 分章</option>
          <option value="none">不分章节（合并为一章）</option>
        </select>
      </div>
      <div class="input-group">
        <div class="input-label">选项</div>
        <label class="checkbox-row">
          <input type="checkbox" id="removeMdSyntax" checked>
          <span class="checkbox-label">去除 Markdown 源码标记（代码块、引用符号等）</span>
        </label>
        <label class="checkbox-row" style="margin-top:6px">
          <input type="checkbox" id="addPageBreak" checked>
          <span class="checkbox-label">章节间添加分页符</span>
        </label>
      </div>

      <div class="btn-row">
        <button class="btn btn-secondary" onclick="previewContent()">预览</button>
        <button class="btn btn-secondary" onclick="clearAll()">清空</button>
      </div>
      <button class="btn btn-primary" id="exportBtn" onclick="exportEpub()" disabled>
        ⬇ 导出 EPUB
      </button>
    </div>
  </div>

  <!-- RIGHT PANEL -->
  <div class="panel-right">
    <div class="panel-tabs">
      <button class="tab active" onclick="switchTab('preview', this)">渲染预览</button>
      <button class="tab" onclick="switchTab('raw', this)">合并内容</button>
    </div>

    <div class="tab-content active" id="tab-preview">
      <div id="previewArea">
        <div class="preview-empty">
          <div class="big-icon">📄</div>
          <p>添加 Markdown 文件后<br>点击「预览」查看合并效果</p>
        </div>
      </div>
    </div>

    <div class="tab-content" id="tab-raw">
      <div id="rawArea">
        <textarea id="rawText" spellcheck="false" placeholder="合并后的文本内容将显示在这里..."></textarea>
      </div>
    </div>
  </div>
</main>

<div id="toast">
  <span id="toastIcon">✓</span>
  <span id="toastMsg">操作成功</span>
</div>

<script>
// ── State ──────────────────────────────────────────────────
let files = []; // {name, content, size}
let dragSrcIdx = null;

// ── File Loading ───────────────────────────────────────────
document.getElementById('fileInput').addEventListener('change', e => {
  loadFiles(Array.from(e.target.files));
  e.target.value = '';
});

const dropzone = document.getElementById('dropzone');
dropzone.addEventListener('dragover', e => { e.preventDefault(); dropzone.classList.add('drag-over'); });
dropzone.addEventListener('dragleave', () => dropzone.classList.remove('drag-over'));
dropzone.addEventListener('drop', e => {
  e.preventDefault();
  dropzone.classList.remove('drag-over');
  const dropped = Array.from(e.dataTransfer.files).filter(f => /\.(md|markdown|txt)$/i.test(f.name));
  if (dropped.length) loadFiles(dropped);
  else toast('请拖入 .md 或 .txt 文件', 'error');
});

// Also allow dropping on the whole window
document.addEventListener('dragover', e => e.preventDefault());
document.addEventListener('drop', e => {
  e.preventDefault();
  const dropped = Array.from(e.dataTransfer.files).filter(f => /\.(md|markdown|txt)$/i.test(f.name));
  if (dropped.length) { loadFiles(dropped); dropzone.classList.remove('drag-over'); }
});

function loadFiles(newFiles) {
  const readers = newFiles.map(file => new Promise(resolve => {
    const r = new FileReader();
    r.onload = ev => resolve({ name: file.name, content: ev.target.result, size: file.size });
    r.readAsText(file, 'UTF-8');
  }));

  setProgress(10);
  Promise.all(readers).then(loaded => {
    // Deduplicate by name
    const names = new Set(files.map(f => f.name));
    const added = loaded.filter(f => !names.has(f.name));
    files.push(...added);
    renderFileList();
    setProgress(100);
    toast(`成功加载 ${added.length} 个文件${loaded.length > added.length ? `（${loaded.length - added.length} 个重复跳过）` : ''}`, 'success');
    document.getElementById('exportBtn').disabled = files.length === 0;
    updateStatus();
    setTimeout(() => setProgress(0), 400);
  });
}

function renderFileList() {
  const list = document.getElementById('fileList');
  const cnt = document.getElementById('fileCount');
  cnt.textContent = files.length;
  cnt.style.display = files.length ? 'inline' : 'none';

  if (!files.length) { list.innerHTML = ''; return; }

  list.innerHTML = files.map((f, i) => `
    <div class="file-item" draggable="true" data-idx="${i}"
         ondragstart="dndStart(event,${i})" ondragover="dndOver(event,${i})"
         ondragleave="dndLeave(event,${i})" ondrop="dndDrop(event,${i})" ondragend="dndEnd()">
      <span class="drag-handle">⠿</span>
      <span class="file-num">${i+1}</span>
      <div class="file-info">
        <div class="file-name" title="${f.name}">${f.name}</div>
        <div class="file-size">${fmtSize(f.size)}</div>
      </div>
      <button class="file-del" onclick="removeFile(${i})" title="移除">×</button>
    </div>
  `).join('');
}

function removeFile(i) {
  files.splice(i, 1);
  renderFileList();
  document.getElementById('exportBtn').disabled = files.length === 0;
  updateStatus();
}

function clearAll() {
  files = [];
  renderFileList();
  document.getElementById('exportBtn').disabled = true;
  document.getElementById('previewArea').innerHTML = `<div class="preview-empty"><div class="big-icon">📄</div><p>添加 Markdown 文件后<br>点击「预览」查看合并效果</p></div>`;
  document.getElementById('rawText').value = '';
  updateStatus();
}

// ── Drag-to-Reorder ────────────────────────────────────────
function dndStart(e, i) { dragSrcIdx = i; e.currentTarget.classList.add('drag-item'); }
function dndOver(e, i) { e.preventDefault(); if (i !== dragSrcIdx) e.currentTarget.classList.add('drag-over-item'); }
function dndLeave(e) { e.currentTarget.classList.remove('drag-over-item'); }
function dndDrop(e, i) {
  e.preventDefault();
  if (i === dragSrcIdx) return;
  const moved = files.splice(dragSrcIdx, 1)[0];
  files.splice(i, 0, moved);
  renderFileList();
}
function dndEnd() { document.querySelectorAll('.file-item').forEach(el => el.classList.remove('drag-item','drag-over-item')); }

// ── Content Building ───────────────────────────────────────
function buildMergedContent() {
  const mode = document.getElementById('chapterMode').value;
  const removeSyntax = document.getElementById('removeMdSyntax').checked;

  if (!files.length) return { chapters: [], raw: '' };

  let chapters = [];

  for (const f of files) {
    let content = f.content;
    if (removeSyntax) content = stripExtraMarkdown(content);

    if (mode === 'file') {
      const title = f.name.replace(/\.(md|markdown|txt)$/i, '');
      chapters.push({ title, content });
    } else if (mode === 'h1' || mode === 'h2') {
      const level = mode === 'h1' ? 1 : 2;
      const regex = level === 1 ? /^# (.+)$/m : /^## (.+)$/m;
      const parts = splitByHeading(content, level);
      if (parts.length === 0) {
        chapters.push({ title: f.name.replace(/\.(md|markdown|txt)$/i, ''), content });
      } else {
        chapters.push(...parts);
      }
    } else {
      chapters.push({ title: null, content });
    }
  }

  if (mode === 'none') {
    const combined = chapters.map(c => c.content).join('\n\n');
    chapters = [{ title: document.getElementById('bookTitle').value || '全文', content: combined }];
  }

  const raw = chapters.map(c => (c.title ? `# ${c.title}\n\n` : '') + c.content).join('\n\n---\n\n');
  return { chapters, raw };
}

function splitByHeading(text, level) {
  const prefix = '#'.repeat(level) + ' ';
  const lines = text.split('\n');
  const result = [];
  let currentTitle = null;
  let currentLines = [];

  for (const line of lines) {
    if (line.startsWith(prefix) && !line.startsWith(prefix + '#')) {
      if (currentLines.some(l => l.trim())) {
        result.push({ title: currentTitle || '（无标题）', content: currentLines.join('\n').trim() });
      }
      currentTitle = line.slice(prefix.length).trim();
      currentLines = [];
    } else {
      currentLines.push(line);
    }
  }
  if (currentLines.some(l => l.trim())) {
    result.push({ title: currentTitle || '（无标题）', content: currentLines.join('\n').trim() });
  }
  return result;
}

function stripExtraMarkdown(text) {
  // Keep most markdown as-is for HTML rendering, but strip raw code fences, horizontal rules noise
  // The real "stripping" happens when we convert to plain text for EPUB
  return text; // We'll handle strip in HTML conversion
}

// Convert MD to clean HTML, removing code block syntax etc.
function mdToHtml(mdText, stripCode = false) {
  let text = mdText;

  if (stripCode) {
    // Replace code blocks with plain content
    text = text.replace(/```[\w]*\n?([\s\S]*?)```/g, (_, code) => `<pre>${escHtml(code.trim())}</pre>`);
    text = text.replace(/`([^`]+)`/g, '$1');
    // Remove blockquote markers
    text = text.replace(/^> /gm, '');
  }

  const renderer = new marked.Renderer();

  if (stripCode) {
    // Override code rendering to plain paragraph
    renderer.code = (code) => `<p>${typeof code === 'object' ? escHtml(code.text || String(code)) : escHtml(String(code))}</p>`;
    renderer.codespan = (code) => typeof code === 'object' ? (code.text || String(code)) : String(code);
    renderer.blockquote = (quote) => `<p>${typeof quote === 'object' ? (quote.text || '') : quote}</p>`;
    renderer.hr = () => '';
  }

  marked.use({ renderer, breaks: true, gfm: true });
  return marked.parse(text);
}

function escHtml(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ── Preview ────────────────────────────────────────────────
function previewContent() {
  if (!files.length) { toast('请先添加文件', 'error'); return; }

  const { chapters, raw } = buildMergedContent();
  document.getElementById('rawText').value = raw;

  const addBreak = document.getElementById('addPageBreak').checked;
  const removeSyntax = document.getElementById('removeMdSyntax').checked;
  const bookTitle = document.getElementById('bookTitle').value || '未命名';

  let html = `<div class="prose">`;
  html += `<h1 style="text-align:center;margin-bottom:0.3em;font-size:2em">${escHtml(bookTitle)}</h1>`;
  const author = document.getElementById('bookAuthor').value;
  if (author) html += `<p style="text-align:center;color:var(--muted);font-family:var(--mono);font-size:12px;margin-bottom:2em">${escHtml(author)}</p>`;

  chapters.forEach((ch, i) => {
    if (i > 0 && addBreak) {
      html += `<div class="chapter-divider">· · ·</div>`;
    }
    if (ch.title) html += `<h2>${escHtml(ch.title)}</h2>`;
    html += mdToHtml(ch.content, removeSyntax);
  });

  html += `</div>`;
  document.getElementById('previewArea').innerHTML = html;
  switchTab('preview', document.querySelectorAll('.tab')[0]);
  toast(`预览生成完毕，共 ${chapters.length} 个章节`);
}

// ── EPUB Export ────────────────────────────────────────────
async function exportEpub() {
  if (!files.length) { toast('请先添加文件', 'error'); return; }

  const btn = document.getElementById('exportBtn');
  btn.disabled = true;
  btn.textContent = '⏳ 生成中...';
  setProgress(20);

  try {
    const { chapters } = buildMergedContent();
    const bookTitle = document.getElementById('bookTitle').value || '未命名';
    const bookAuthor = document.getElementById('bookAuthor').value || '未知作者';
    const uid = 'ebook-' + Date.now();
    const removeSyntax = document.getElementById('removeMdSyntax').checked;
    const addBreak = document.getElementById('addPageBreak').checked;

    setProgress(40);
    const zip = new JSZip();

    // mimetype (must be first, uncompressed)
    zip.file('mimetype', 'application/epub+zip', { compression: 'STORE' });

    // META-INF/container.xml
    zip.folder('META-INF').file('container.xml',
`<?xml version="1.0" encoding="UTF-8"?>
<container version="1.0" xmlns="urn:oasis:schemas:container">
  <rootfiles>
    <rootfile full-path="OEBPS/content.opf" media-type="application/oebps-package+xml"/>
  </rootfiles>
</container>`);

    // Build chapters
    const oebps = zip.folder('OEBPS');
    const chapterFiles = [];

    chapters.forEach((ch, i) => {
      const fname = `chapter${String(i+1).padStart(3,'0')}.xhtml`;
      const htmlContent = mdToHtml(ch.content, removeSyntax);
      const pageBreakStyle = addBreak && i > 0 ? 'page-break-before: always;' : '';
      const titleTag = ch.title ? `<h2 class="ch-title">${escHtml(ch.title)}</h2>` : '';

      const xhtml =
`<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.1//EN" "http://www.w3.org/TR/xhtml11/DTD/xhtml11.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="zh-CN">
<head>
  <meta charset="UTF-8"/>
  <title>${escHtml(ch.title || bookTitle)}</title>
  <link rel="stylesheet" href="style.css" type="text/css"/>
</head>
<body style="${pageBreakStyle}">
${titleTag}
${htmlContent}
</body>
</html>`;
      oebps.file(fname, xhtml);
      chapterFiles.push({ fname, title: ch.title || `第 ${i+1} 部分`, id: `ch${i+1}` });
    });

    setProgress(60);

    // CSS
    oebps.file('style.css',
`body {
  font-family: "Noto Serif SC", "Source Han Serif CN", "SimSun", serif;
  font-size: 1em;
  line-height: 1.9;
  color: #1a1a1a;
  margin: 0 1.5em;
  text-align: justify;
}
h1 { font-size: 1.8em; margin: 1.5em 0 0.8em; text-align: center; }
h2 { font-size: 1.4em; margin: 2em 0 0.8em; }
h3 { font-size: 1.15em; margin: 1.5em 0 0.6em; }
.ch-title { font-size: 1.5em; margin: 0.5em 0 1.5em; text-align: center; border-bottom: 1px solid #ccc; padding-bottom: 0.5em; }
p { margin: 0.8em 0; text-indent: 2em; }
blockquote { margin: 1em 2em; color: #555; font-style: italic; border-left: 3px solid #ccc; padding-left: 1em; }
pre { background: #f5f5f5; padding: 1em; overflow-x: auto; font-size: 0.85em; }
code { font-family: monospace; font-size: 0.88em; background: #f0f0f0; padding: 0 3px; }
table { width: 100%; border-collapse: collapse; margin: 1em 0; }
th, td { border: 1px solid #ccc; padding: 6px 10px; }
th { background: #f5f5f5; }
img { max-width: 100%; height: auto; }
a { color: #2563eb; }
`);

    // Cover XHTML
    oebps.file('cover.xhtml',
`<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.1//EN" "http://www.w3.org/TR/xhtml11/DTD/xhtml11.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="zh-CN">
<head><meta charset="UTF-8"/><title>封面</title>
<style>
  body { text-align: center; display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 90vh; font-family: serif; }
  h1 { font-size: 2.5em; margin-bottom: 0.5em; color: #1a1a1a; }
  p { font-size: 1.2em; color: #555; }
</style>
</head>
<body>
<h1>${escHtml(bookTitle)}</h1>
<p>${escHtml(bookAuthor)}</p>
<p style="font-size:0.85em;color:#999;margin-top:3em">Generated by MD→EPUB Merger</p>
</body>
</html>`);

    // TOC XHTML (EPUB3)
    const tocItems = chapterFiles.map(c =>
      `<li><a href="${c.fname}">${escHtml(c.title)}</a></li>`).join('\n        ');
    oebps.file('toc.xhtml',
`<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.1//EN" "http://www.w3.org/TR/xhtml11/DTD/xhtml11.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:epub="http://www.idpf.org/2007/ops" xml:lang="zh-CN">
<head><meta charset="UTF-8"/><title>目录</title></head>
<body>
  <nav epub:type="toc">
    <h2>目录</h2>
    <ol>
        ${tocItems}
    </ol>
  </nav>
</body>
</html>`);

    // NCX (for EPUB2 compatibility)
    const navPoints = chapterFiles.map((c, i) =>
`    <navPoint id="navPoint-${i+1}" playOrder="${i+2}">
      <navLabel><text>${escHtml(c.title)}</text></navLabel>
      <content src="${c.fname}"/>
    </navPoint>`).join('\n');

    oebps.file('toc.ncx',
`<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE ncx PUBLIC "-//NISO//DTD ncx 2005-1//EN" "http://www.daisy.org/z3986/2005/ncx-2005-1.dtd">
<ncx xmlns="http://www.daisy.org/z3986/2005/ncx/" version="2005-1">
  <head>
    <meta name="dtb:uid" content="${uid}"/>
    <meta name="dtb:depth" content="1"/>
    <meta name="dtb:totalPageCount" content="0"/>
    <meta name="dtb:maxPageNumber" content="0"/>
  </head>
  <docTitle><text>${escHtml(bookTitle)}</text></docTitle>
  <navMap>
    <navPoint id="navPoint-0" playOrder="1">
      <navLabel><text>封面</text></navLabel>
      <content src="cover.xhtml"/>
    </navPoint>
${navPoints}
  </navMap>
</ncx>`);

    // content.opf
    const manifestItems = [
      `<item id="cover" href="cover.xhtml" media-type="application/xhtml+xml"/>`,
      `<item id="toc-xhtml" href="toc.xhtml" media-type="application/xhtml+xml" properties="nav"/>`,
      `<item id="ncx" href="toc.ncx" media-type="application/x-dtbncx+xml"/>`,
      `<item id="css" href="style.css" media-type="text/css"/>`,
      ...chapterFiles.map(c => `<item id="${c.id}" href="${c.fname}" media-type="application/xhtml+xml"/>`)
    ].join('\n    ');

    const spineItems = [
      `<itemref idref="cover"/>`,
      ...chapterFiles.map(c => `<itemref idref="${c.id}"/>`)
    ].join('\n    ');

    const dateNow = new Date().toISOString().split('T')[0];
    oebps.file('content.opf',
`<?xml version="1.0" encoding="UTF-8"?>
<package xmlns="http://www.idpf.org/2007/opf" unique-identifier="BookId" version="3.0">
  <metadata xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:opf="http://www.idpf.org/2007/opf">
    <dc:identifier id="BookId">${uid}</dc:identifier>
    <dc:title>${escHtml(bookTitle)}</dc:title>
    <dc:creator>${escHtml(bookAuthor)}</dc:creator>
    <dc:language>zh-CN</dc:language>
    <dc:date>${dateNow}</dc:date>
    <meta property="dcterms:modified">${new Date().toISOString().replace(/\.\d+Z$/, 'Z')}</meta>
  </metadata>
  <manifest>
    ${manifestItems}
  </manifest>
  <spine toc="ncx">
    ${spineItems}
  </spine>
</package>`);

    setProgress(80);

    // Generate ZIP
    const blob = await zip.generateAsync({
      type: 'blob',
      mimeType: 'application/epub+zip',
      compression: 'DEFLATE',
      compressionOptions: { level: 9 }
    });

    setProgress(95);

    // Download
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `${bookTitle.replace(/[<>:"/\\|?*]/g, '_')}.epub`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 2000);

    setProgress(100);
    toast(`EPUB 已导出：${a.download}（${chapters.length} 章节）`, 'success');
    setTimeout(() => setProgress(0), 600);

  } catch (err) {
    console.error(err);
    toast('导出失败：' + err.message, 'error');
    setProgress(0);
  }

  btn.disabled = false;
  btn.textContent = '⬇ 导出 EPUB';
}

// ── UI Helpers ─────────────────────────────────────────────
function switchTab(id, el) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('tab-' + id).classList.add('active');
}

let toastTimer;
function toast(msg, type = '') {
  const el = document.getElementById('toast');
  const icon = document.getElementById('toastIcon');
  const msgEl = document.getElementById('toastMsg');
  el.className = type ? `show ${type}` : 'show';
  icon.textContent = type === 'error' ? '✕' : type === 'success' ? '✓' : 'ℹ';
  msgEl.textContent = msg;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 3500);
}

function setProgress(pct) {
  const bar = document.getElementById('progressBar');
  if (pct === 0) { bar.style.display = 'none'; bar.style.width = '0%'; return; }
  bar.style.display = 'block';
  bar.style.width = pct + '%';
}

function updateStatus() {
  const total = files.reduce((s, f) => s + f.size, 0);
  document.getElementById('statusText').textContent =
    files.length ? `${files.length} 个文件 · ${fmtSize(total)}` : '就绪';
}

function fmtSize(bytes) {
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1024*1024) return (bytes/1024).toFixed(1) + ' KB';
  return (bytes/1024/1024).toFixed(2) + ' MB';
}

// Keyboard shortcut: Ctrl+Enter to export
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
    if (!document.getElementById('exportBtn').disabled) exportEpub();
  }
  if ((e.ctrlKey || e.metaKey) && e.key === 'p') {
    e.preventDefault();
    if (files.length) previewContent();
  }
});
</script>
