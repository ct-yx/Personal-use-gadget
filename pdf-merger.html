<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDF 合成工具</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Noto+Sans+SC:wght@300;400;500&display=swap');

  :root {
    --bg: #0e0e10;
    --surface: #16161a;
    --border: #2a2a32;
    --accent: #e8ff47;
    --accent-dim: #b8cc30;
    --text: #e2e2e8;
    --text-dim: #7a7a8c;
    --danger: #ff4757;
    --success: #2ecc71;
    --radius: 4px;
    --mono: 'Space Mono', monospace;
    --sans: 'Noto Sans SC', sans-serif;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html { scroll-behavior: smooth; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
    overflow-x: hidden;
    font-size: 14px;
    line-height: 1.6;
  }

  /* grid bg */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(var(--border) 1px, transparent 1px),
      linear-gradient(90deg, var(--border) 1px, transparent 1px);
    background-size: 40px 40px;
    opacity: 0.3;
    pointer-events: none;
    z-index: 0;
  }

  .container {
    position: relative;
    z-index: 1;
    max-width: 820px;
    margin: 0 auto;
    padding: 48px 24px 80px;
  }

  /* ─── HEADER ─── */
  .header {
    margin-bottom: 40px;
  }
  .header-eyebrow {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .header-eyebrow::before {
    content: '';
    display: inline-block;
    width: 20px;
    height: 2px;
    background: var(--accent);
  }
  h1 {
    font-family: var(--mono);
    font-size: clamp(28px, 5vw, 42px);
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1.1;
    color: #fff;
  }
  h1 span { color: var(--accent); }
  .header-sub {
    margin-top: 10px;
    font-size: 13px;
    color: var(--text-dim);
    font-family: var(--mono);
  }

  /* ─── DROPZONE ─── */
  .dropzone {
    border: 2px dashed var(--border);
    border-radius: var(--radius);
    padding: 48px 24px;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.2s, background 0.2s;
    position: relative;
    background: var(--surface);
  }
  .dropzone.over {
    border-color: var(--accent);
    background: rgba(232,255,71,0.04);
  }
  .dropzone:hover {
    border-color: #444;
  }
  .drop-icon {
    width: 52px;
    height: 52px;
    margin: 0 auto 16px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .drop-icon svg {
    width: 100%;
    height: 100%;
    stroke: var(--text-dim);
    transition: stroke 0.2s;
  }
  .dropzone.over .drop-icon svg,
  .dropzone:hover .drop-icon svg { stroke: var(--accent); }
  .drop-title {
    font-family: var(--mono);
    font-size: 15px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 6px;
  }
  .drop-sub {
    font-size: 12px;
    color: var(--text-dim);
    font-family: var(--mono);
  }
  .drop-sub em { color: var(--accent); font-style: normal; }
  #fileInput { display: none; }

  /* ─── TOOLBAR ─── */
  .toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 28px;
    margin-bottom: 12px;
    gap: 12px;
    flex-wrap: wrap;
  }
  .file-count {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-dim);
    letter-spacing: 0.1em;
  }
  .file-count strong {
    color: var(--accent);
    font-size: 14px;
  }
  .toolbar-actions {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  /* ─── BUTTONS ─── */
  .btn {
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 8px 16px;
    border: 1.5px solid currentColor;
    border-radius: var(--radius);
    cursor: pointer;
    transition: background 0.15s, color 0.15s, transform 0.1s;
    background: transparent;
    user-select: none;
  }
  .btn:active { transform: scale(0.97); }
  .btn-ghost { color: var(--text-dim); border-color: var(--border); }
  .btn-ghost:hover { color: var(--text); border-color: var(--text-dim); }
  .btn-danger { color: var(--danger); border-color: var(--danger); }
  .btn-danger:hover { background: var(--danger); color: #fff; }
  .btn-primary {
    background: var(--accent);
    color: #0e0e10;
    border-color: var(--accent);
    font-size: 13px;
    padding: 12px 28px;
  }
  .btn-primary:hover { background: var(--accent-dim); border-color: var(--accent-dim); }
  .btn-primary:disabled {
    opacity: 0.4;
    cursor: not-allowed;
    transform: none;
  }

  /* ─── FILE LIST ─── */
  .file-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
    min-height: 0;
  }

  .file-item {
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    display: grid;
    grid-template-columns: 28px 36px 1fr auto auto;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    cursor: default;
    transition: border-color 0.15s, background 0.15s;
    animation: slideIn 0.18s ease;
    position: relative;
  }
  @keyframes slideIn {
    from { opacity: 0; transform: translateY(-6px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .file-item.dragging {
    opacity: 0.45;
    border-color: var(--accent);
  }
  .file-item.drag-over {
    border-color: var(--accent);
    background: rgba(232,255,71,0.04);
  }

  .drag-handle {
    cursor: grab;
    color: var(--text-dim);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2px;
    border-radius: 2px;
    transition: color 0.15s;
    flex-shrink: 0;
  }
  .drag-handle:hover { color: var(--text); }
  .drag-handle:active { cursor: grabbing; }
  .drag-handle svg { width: 14px; height: 14px; }

  .file-index {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--text-dim);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 2px;
    width: 28px;
    height: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .file-info { overflow: hidden; }
  .file-name {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .file-meta {
    display: flex;
    gap: 12px;
    margin-top: 2px;
  }
  .file-size {
    font-size: 11px;
    color: var(--text-dim);
    font-family: var(--mono);
  }
  .file-pages {
    font-size: 11px;
    color: var(--accent);
    font-family: var(--mono);
  }
  .file-pages.loading { color: var(--text-dim); }

  .file-remove {
    background: none;
    border: none;
    cursor: pointer;
    color: var(--text-dim);
    padding: 4px;
    border-radius: 2px;
    transition: color 0.15s;
    display: flex;
    align-items: center;
    flex-shrink: 0;
  }
  .file-remove:hover { color: var(--danger); }
  .file-remove svg { width: 14px; height: 14px; }

  /* ─── MERGE SECTION ─── */
  .merge-section {
    margin-top: 28px;
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    padding: 20px 24px;
  }
  .merge-row {
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
  }
  .filename-input-wrap {
    flex: 1;
    min-width: 200px;
  }
  .filename-label {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 6px;
  }
  .filename-input {
    width: 100%;
    background: var(--bg);
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    font-family: var(--mono);
    font-size: 13px;
    padding: 9px 12px;
    outline: none;
    transition: border-color 0.15s;
  }
  .filename-input:focus { border-color: var(--accent); }

  /* ─── PROGRESS ─── */
  .progress-wrap {
    margin-top: 16px;
    display: none;
  }
  .progress-wrap.active { display: block; }
  .progress-label {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-dim);
    margin-bottom: 6px;
    display: flex;
    justify-content: space-between;
  }
  .progress-bar-bg {
    height: 4px;
    background: var(--bg);
    border-radius: 2px;
    overflow: hidden;
    border: 1px solid var(--border);
  }
  .progress-bar-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 2px;
    transition: width 0.2s ease;
    width: 0%;
  }

  /* ─── STATUS / TOAST ─── */
  .status-msg {
    margin-top: 12px;
    font-family: var(--mono);
    font-size: 12px;
    padding: 8px 12px;
    border-radius: var(--radius);
    display: none;
  }
  .status-msg.show { display: block; }
  .status-msg.success { color: var(--success); background: rgba(46,204,113,0.07); border: 1px solid rgba(46,204,113,0.2); }
  .status-msg.error   { color: var(--danger);  background: rgba(255,71,87,0.07);  border: 1px solid rgba(255,71,87,0.2); }
  .status-msg.info    { color: var(--text-dim); background: var(--bg);            border: 1px solid var(--border); }

  /* ─── EMPTY STATE ─── */
  .empty-hint {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-dim);
    text-align: center;
    padding: 20px;
    display: none;
  }

  /* ─── STATS BAR ─── */
  .stats-bar {
    display: flex;
    gap: 24px;
    margin-top: 8px;
    padding: 10px 14px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    flex-wrap: wrap;
    display: none;
  }
  .stats-bar.show { display: flex; }
  .stat-item {
    font-family: var(--mono);
    font-size: 11px;
  }
  .stat-label { color: var(--text-dim); }
  .stat-value { color: var(--text); margin-left: 4px; }
  .stat-value.accent { color: var(--accent); }

  /* ─── FOOTER ─── */
  .footer {
    margin-top: 60px;
    border-top: 1px solid var(--border);
    padding-top: 20px;
    font-family: var(--mono);
    font-size: 10px;
    color: var(--text-dim);
    letter-spacing: 0.05em;
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }
  .lib-tag {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 2px 7px;
    border-radius: 2px;
    color: var(--text-dim);
  }
  .lib-tag .dot {
    width: 5px; height: 5px;
    border-radius: 50%;
    background: var(--success);
  }

  /* scrollbar */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
</style>
</head>
<body>

<div class="container">
  <!-- HEADER -->
  <div class="header">
    <div class="header-eyebrow">文档工具</div>
    <h1>PDF <span>合成</span></h1>
    <p class="header-sub">// 多文件合并 · 拖拽排序 · 纯浏览器处理 · 不上传服务器</p>
  </div>

  <!-- DROPZONE -->
  <div class="dropzone" id="dropzone">
    <div class="drop-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 16V4M8 8l4-4 4 4"/>
        <path d="M20 16v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2"/>
      </svg>
    </div>
    <div class="drop-title">拖拽 PDF 文件到此处</div>
    <div class="drop-sub">或 <em>点击选择文件</em> — 支持一次性添加多个</div>
    <input type="file" id="fileInput" accept=".pdf,application/pdf" multiple>
  </div>

  <!-- TOOLBAR -->
  <div class="toolbar" id="toolbar" style="display:none">
    <div class="file-count">已添加 <strong id="countNum">0</strong> 个文件</div>
    <div class="toolbar-actions">
      <button class="btn btn-ghost" onclick="addMore()">＋ 继续添加</button>
      <button class="btn btn-danger" onclick="clearAll()">清空全部</button>
    </div>
  </div>

  <!-- STATS -->
  <div class="stats-bar" id="statsBar">
    <div class="stat-item"><span class="stat-label">总文件</span><span class="stat-value accent" id="statFiles">0</span></div>
    <div class="stat-item"><span class="stat-label">总页数</span><span class="stat-value accent" id="statPages">—</span></div>
    <div class="stat-item"><span class="stat-label">总大小</span><span class="stat-value" id="statSize">—</span></div>
  </div>

  <!-- FILE LIST -->
  <div class="file-list" id="fileList"></div>

  <!-- MERGE SECTION -->
  <div class="merge-section" id="mergeSection" style="display:none">
    <div class="merge-row">
      <div class="filename-input-wrap">
        <div class="filename-label">输出文件名</div>
        <input type="text" class="filename-input" id="outputName" value="merged" placeholder="输出文件名（无需 .pdf）">
      </div>
      <button class="btn btn-primary" id="mergeBtn" onclick="mergePDFs()">
        ⬇ 合成并下载
      </button>
    </div>
    <div class="progress-wrap" id="progressWrap">
      <div class="progress-label">
        <span id="progressText">准备中…</span>
        <span id="progressPct">0%</span>
      </div>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progressFill"></div>
      </div>
    </div>
    <div class="status-msg" id="statusMsg"></div>
  </div>

  <!-- FOOTER -->
  <div class="footer">
    <span>所有处理在本地浏览器完成 · 文件不会上传</span>
    <span class="lib-tag"><span class="dot"></span>pdf-lib v1.17.1 · cdnjs</span>
  </div>
</div>

<!-- pdf-lib CDN (已验证可用) -->
<script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>

<script>
/* ══════════════════════════════════════════
   STATE
══════════════════════════════════════════ */
let files = [];           // { file, pages, id }
let dragSrcIdx = null;
let pdfLibLoaded = false;

/* ══════════════════════════════════════════
   INIT
══════════════════════════════════════════ */
window.addEventListener('load', () => {
  if (typeof PDFLib !== 'undefined') {
    pdfLibLoaded = true;
    console.log('[PDF Merger] pdf-lib loaded OK');
  } else {
    showStatus('error', '⚠ pdf-lib 加载失败，请检查网络连接后刷新页面');
    document.getElementById('mergeBtn').disabled = true;
  }
});

/* ══════════════════════════════════════════
   DROPZONE
══════════════════════════════════════════ */
const dropzone = document.getElementById('dropzone');
const fileInput = document.getElementById('fileInput');

dropzone.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', e => addFiles(Array.from(e.target.files)));

dropzone.addEventListener('dragover', e => {
  e.preventDefault();
  dropzone.classList.add('over');
});
dropzone.addEventListener('dragleave', () => dropzone.classList.remove('over'));
dropzone.addEventListener('drop', e => {
  e.preventDefault();
  dropzone.classList.remove('over');
  const pdfs = Array.from(e.dataTransfer.files).filter(f => f.type === 'application/pdf' || f.name.endsWith('.pdf'));
  addFiles(pdfs);
});

function addMore() { fileInput.click(); }

/* ══════════════════════════════════════════
   FILE MANAGEMENT
══════════════════════════════════════════ */
let uidCounter = 0;

async function addFiles(newFiles) {
  const pdfs = newFiles.filter(f => f.name.toLowerCase().endsWith('.pdf') || f.type === 'application/pdf');
  if (!pdfs.length) return;

  // reset input so same files can be re-added
  fileInput.value = '';

  for (const f of pdfs) {
    const id = ++uidCounter;
    files.push({ file: f, pages: null, id });
    renderFileList();
    // async page count
    countPages(f, id);
  }
  updateUI();
}

async function countPages(file, id) {
  try {
    const buf = await file.arrayBuffer();
    const pdf = await PDFLib.PDFDocument.load(buf, { ignoreEncryption: true });
    const count = pdf.getPageCount();
    const entry = files.find(x => x.id === id);
    if (entry) {
      entry.pages = count;
      updatePageEl(id, count);
      updateStats();
    }
  } catch (e) {
    const entry = files.find(x => x.id === id);
    if (entry) { entry.pages = '?'; updatePageEl(id, '?'); }
  }
}

function updatePageEl(id, count) {
  const el = document.querySelector(`[data-pageid="${id}"]`);
  if (el) {
    el.textContent = count === '?' ? '页数未知' : `${count} 页`;
    el.className = 'file-pages';
  }
}

function removeFile(id) {
  files = files.filter(x => x.id !== id);
  renderFileList();
  updateUI();
  updateStats();
}

function clearAll() {
  files = [];
  renderFileList();
  updateUI();
  updateStats();
}

/* ══════════════════════════════════════════
   RENDER
══════════════════════════════════════════ */
function renderFileList() {
  const list = document.getElementById('fileList');
  list.innerHTML = '';

  files.forEach((entry, idx) => {
    const item = document.createElement('div');
    item.className = 'file-item';
    item.draggable = true;
    item.dataset.idx = idx;

    item.innerHTML = `
      <div class="drag-handle" title="拖拽排序">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="9" cy="6" r="1" fill="currentColor"/>
          <circle cx="15" cy="6" r="1" fill="currentColor"/>
          <circle cx="9" cy="12" r="1" fill="currentColor"/>
          <circle cx="15" cy="12" r="1" fill="currentColor"/>
          <circle cx="9" cy="18" r="1" fill="currentColor"/>
          <circle cx="15" cy="18" r="1" fill="currentColor"/>
        </svg>
      </div>
      <div class="file-index">${idx + 1}</div>
      <div class="file-info">
        <div class="file-name" title="${escHtml(entry.file.name)}">${escHtml(entry.file.name)}</div>
        <div class="file-meta">
          <span class="file-size">${fmtSize(entry.file.size)}</span>
          <span class="file-pages ${entry.pages === null ? 'loading' : ''}"
                data-pageid="${entry.id}">
            ${entry.pages === null ? '读取中…' : (entry.pages === '?' ? '页数未知' : entry.pages + ' 页')}
          </span>
        </div>
      </div>
      <button class="file-remove" onclick="removeFile(${entry.id})" title="移除">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M18 6L6 18M6 6l12 12"/>
        </svg>
      </button>
    `;

    // drag events for reordering
    item.addEventListener('dragstart', e => {
      dragSrcIdx = idx;
      e.dataTransfer.effectAllowed = 'move';
      setTimeout(() => item.classList.add('dragging'), 0);
    });
    item.addEventListener('dragend', () => {
      item.classList.remove('dragging');
      document.querySelectorAll('.file-item').forEach(el => el.classList.remove('drag-over'));
    });
    item.addEventListener('dragover', e => {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      document.querySelectorAll('.file-item').forEach(el => el.classList.remove('drag-over'));
      item.classList.add('drag-over');
    });
    item.addEventListener('dragleave', () => item.classList.remove('drag-over'));
    item.addEventListener('drop', e => {
      e.preventDefault();
      item.classList.remove('drag-over');
      if (dragSrcIdx !== null && dragSrcIdx !== idx) {
        const moved = files.splice(dragSrcIdx, 1)[0];
        files.splice(idx, 0, moved);
        dragSrcIdx = null;
        renderFileList();
        updateStats();
      }
    });

    list.appendChild(item);
  });
}

function updateUI() {
  const hasFiles = files.length > 0;
  document.getElementById('toolbar').style.display      = hasFiles ? 'flex'  : 'none';
  document.getElementById('statsBar').classList.toggle('show', hasFiles);
  document.getElementById('mergeSection').style.display = hasFiles ? 'block' : 'none';
  document.getElementById('countNum').textContent = files.length;
  updateStats();
}

function updateStats() {
  document.getElementById('statFiles').textContent = files.length;
  const totalSize = files.reduce((s, x) => s + x.file.size, 0);
  document.getElementById('statSize').textContent = fmtSize(totalSize);

  const allCounted = files.every(x => x.pages !== null);
  if (allCounted && files.length > 0) {
    const totalPages = files.reduce((s, x) => s + (typeof x.pages === 'number' ? x.pages : 0), 0);
    document.getElementById('statPages').textContent = totalPages || '—';
  } else {
    document.getElementById('statPages').textContent = '计算中…';
  }
}

/* ══════════════════════════════════════════
   MERGE
══════════════════════════════════════════ */
async function mergePDFs() {
  if (!pdfLibLoaded) {
    showStatus('error', '⚠ pdf-lib 未加载，请刷新页面重试');
    return;
  }
  if (files.length === 0) {
    showStatus('error', '请先添加 PDF 文件');
    return;
  }
  if (files.length === 1) {
    showStatus('info', '只有一个文件，直接下载即可');
    return;
  }

  const btn = document.getElementById('mergeBtn');
  btn.disabled = true;
  setProgress(true, '初始化…', 0);
  hideStatus();

  try {
    const merged = await PDFLib.PDFDocument.create();
    const total = files.length;

    for (let i = 0; i < total; i++) {
      const entry = files[i];
      setProgress(true, `正在处理 (${i + 1}/${total}): ${entry.file.name}`, Math.round(i / total * 90));

      const buf = await entry.file.arrayBuffer();
      let srcDoc;
      try {
        srcDoc = await PDFLib.PDFDocument.load(buf, { ignoreEncryption: true });
      } catch (e) {
        showStatus('error', `⚠ 文件 "${entry.file.name}" 读取失败，已跳过`);
        continue;
      }

      const pageCount = srcDoc.getPageCount();
      const indices = Array.from({ length: pageCount }, (_, k) => k);

      // copy pages in chunks for large PDFs (avoid blocking UI)
      const CHUNK = 50;
      for (let start = 0; start < pageCount; start += CHUNK) {
        const chunk = indices.slice(start, start + CHUNK);
        const copied = await merged.copyPages(srcDoc, chunk);
        copied.forEach(p => merged.addPage(p));
        // yield to browser
        await new Promise(r => setTimeout(r, 0));
      }
    }

    setProgress(true, '正在序列化输出…', 92);
    await new Promise(r => setTimeout(r, 0));

    const outBytes = await merged.save();
    setProgress(true, '完成', 100);

    const blob = new Blob([outBytes], { type: 'application/pdf' });
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    const name = (document.getElementById('outputName').value.trim() || 'merged').replace(/\.pdf$/i, '') + '.pdf';
    a.href = url;
    a.download = name;
    a.click();

    setTimeout(() => URL.revokeObjectURL(url), 10000);

    const totalPages = merged.getPageCount();
    showStatus('success', `✓ 合成完成！共 ${totalPages} 页，来自 ${total} 个文件。文件已开始下载。`);
    setProgress(false);

  } catch (err) {
    console.error(err);
    showStatus('error', '⚠ 合成失败：' + err.message);
    setProgress(false);
  } finally {
    btn.disabled = false;
  }
}

/* ══════════════════════════════════════════
   HELPERS
══════════════════════════════════════════ */
function setProgress(show, text = '', pct = 0) {
  const wrap = document.getElementById('progressWrap');
  wrap.className = 'progress-wrap' + (show ? ' active' : '');
  document.getElementById('progressText').textContent = text;
  document.getElementById('progressPct').textContent = pct + '%';
  document.getElementById('progressFill').style.width = pct + '%';
}

function showStatus(type, msg) {
  const el = document.getElementById('statusMsg');
  el.className = `status-msg show ${type}`;
  el.textContent = msg;
}
function hideStatus() {
  document.getElementById('statusMsg').className = 'status-msg';
}

function fmtSize(bytes) {
  if (bytes < 1024)        return bytes + ' B';
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
  return (bytes / 1024 / 1024).toFixed(2) + ' MB';
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
