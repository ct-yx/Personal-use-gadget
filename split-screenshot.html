<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>长截图 9:16 分割工具</title>
    <style>
        :root {
            --primary-color: #007AFF;
            --bg-color: #f5f5f7;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            margin: 0;
        }
        .container {
            max-width: 1000px;
            width: 100%;
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
        h2 { text-align: center; color: #333; }
        .upload-area {
            border: 2px dashed #ccc;
            padding: 40px;
            text-align: center;
            border-radius: 12px;
            cursor: pointer;
            transition: border 0.3s;
            margin-bottom: 20px;
        }
        .upload-area:hover { border-color: var(--primary-color); }
        #fileInput { display: none; }
        
        .controls {
            display: flex;
            gap: 15px;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
        }
        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
        }
        button:hover { opacity: 0.9; }
        #status { color: #666; font-size: 14px; }

        #result {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .slice-item {
            display: flex;
            flex-direction: column;
            border: 1px solid #ddd;
            border-radius: 12px;
            overflow: hidden;
            background: #fff;
            transition: transform 0.2s;
        }
        .slice-item:hover { transform: translateY(-5px); }
        .slice-item canvas {
            width: 100%;
            height: auto;
            display: block;
            background: #eee;
        }
        .slice-info {
            padding: 10px;
            font-size: 12px;
            text-align: center;
            background: #fafafa;
            border-top: 1px solid #eee;
        }
        .download-link {
            display: block;
            margin-top: 5px;
            color: var(--primary-color);
            text-decoration: none;
            font-weight: bold;
        }
    </style>
<link rel="stylesheet" href="mono-grid-style.css">
</head>
<body class="page-splitscreen">
<div class="mg-particles" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span><span></span></div>

<div class="container">
    <h2>📱 长截图 9:16 自动分割器</h2>
    
    <div class="upload-area" id="dropZone" onclick="document.getElementById('fileInput').click()">
        <p>点击或拖拽长截图到这里</p>
        <p style="font-size: 12px; color: #999;">我们将按照图片的宽度，自动计算对应的 9:16 高度进行切割</p>
        <input type="file" id="fileInput" accept="image/*">
    </div>

    <div class="controls">
        <button id="downloadAllBtn" style="display: none;">打包下载所有 9:16 切片 (ZIP)</button>
        <span id="status"></span>
    </div>

    <div id="result"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<script>
    const fileInput = document.getElementById('fileInput');
    const resultContainer = document.getElementById('result');
    const downloadAllBtn = document.getElementById('downloadAllBtn');
    const status = document.getElementById('status');
    const dropZone = document.getElementById('dropZone');

    let generatedImages = [];

    // 处理拖拽
    dropZone.ondragover = (e) => { e.preventDefault(); dropZone.style.borderColor = "var(--primary-color)"; };
    dropZone.ondragleave = () => { dropZone.style.borderColor = "#ccc"; };
    dropZone.ondrop = (e) => {
        e.preventDefault();
        const file = e.dataTransfer.files[0];
        if (file) handleFile(file);
    };

    fileInput.onchange = (e) => handleFile(e.target.files[0]);

    function handleFile(file) {
        if (!file || !file.type.startsWith('image/')) return;
        
        const reader = new FileReader();
        reader.onload = (e) => {
            const img = new Image();
            img.onload = () => processImage(img, file.name);
            img.src = e.target.result;
        };
        reader.readAsDataURL(file);
    }

    function processImage(img, fileName) {
        resultContainer.innerHTML = '';
        generatedImages = [];
        
        const w = img.width;
        // 关键逻辑修改：9:16 比例下的高度 H = W * 16 / 9
        const sliceH = Math.floor(w * 16 / 9);
        const totalH = img.height;
        const numSlices = Math.ceil(totalH / sliceH);

        status.innerText = `宽度: ${w}px | 每张高度: ${sliceH}px | 分割数量: ${numSlices}`;
        downloadAllBtn.style.display = 'inline-block';

        for (let i = 0; i < numSlices; i++) {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            
            canvas.width = w;
            canvas.height = sliceH;

            const sourceY = i * sliceH;
            
            // 填充白色底色，处理最后一张不足 9:16 的情况
            ctx.fillStyle = "#ffffff";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 绘制
            ctx.drawImage(img, 0, sourceY, w, sliceH, 0, 0, w, sliceH);

            const sliceDiv = document.createElement('div');
            sliceDiv.className = 'slice-item';
            
            const partName = `${fileName.split('.')[0]}_${i + 1}.jpg`;
            const dataUrl = canvas.toDataURL('image/jpeg', 0.92);

            sliceDiv.innerHTML = `
                <div class="slice-info">
                    第 ${i + 1} 张<br>
                    <a class="download-link" href="${dataUrl}" download="${partName}">点击下载</a>
                </div>
            `;
            sliceDiv.prepend(canvas);
            resultContainer.appendChild(sliceDiv);
            
            generatedImages.push({ name: partName, url: dataUrl });
        }
    }

    // 打包下载
    downloadAllBtn.onclick = async function() {
        if (generatedImages.length === 0) return;
        downloadAllBtn.disabled = true;
        downloadAllBtn.innerText = "正在打包...";
        
        const zip = new JSZip();
        generatedImages.forEach(img => {
            const base64Data = img.url.split(',')[1];
            zip.file(img.name, base64Data, {base64: true});
        });

        const blob = await zip.generateAsync({type: "blob"});
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = "9_16_slices.zip";
        link.click();
        
        downloadAllBtn.disabled = false;
        downloadAllBtn.innerText = "打包下载所有 9:16 切片 (ZIP)";
    };
</script>

</body>
</html>
