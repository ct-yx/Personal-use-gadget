<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HOTSPOT KEY</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f5f5f3;
    --fg: #111110;
    --mid: #888885;
    --border: #d0d0cc;
    --surface: #ffffff;
  }

  body {
    background: var(--bg);
    color: var(--fg);
    font-family: 'DM Mono', monospace;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .wrap {
    width: min(420px, 100%);
    animation: up 0.6s cubic-bezier(0.16,1,0.3,1) both;
  }

  @keyframes up {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* 顶部 */
  .top {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 6px;
  }

  .site-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 13px;
    letter-spacing: 0.35em;
    color: var(--mid);
  }

  .clock {
    font-size: 12px;
    color: var(--mid);
    letter-spacing: 0.05em;
  }

  /* 主卡 */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 32px 28px 24px;
    display: flex;
    flex-direction: column;
    gap: 28px;
  }

  /* 密码 */
  .key-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }

  .key-label {
    font-size: 10px;
    letter-spacing: 0.4em;
    color: var(--mid);
    text-transform: uppercase;
  }

  .key {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(56px, 16vw, 80px);
    letter-spacing: 0.06em;
    line-height: 1;
    cursor: pointer;
    user-select: all;
    color: var(--fg);
    transition: opacity 0.15s;
    animation: reveal 0.5s 0.2s cubic-bezier(0.16,1,0.3,1) both;
  }

  @keyframes reveal {
    from { opacity: 0; letter-spacing: 0.3em; }
    to   { opacity: 1; letter-spacing: 0.06em; }
  }

  .key:active { opacity: 0.4; }

  .copy-tip {
    font-size: 10px;
    letter-spacing: 0.25em;
    color: var(--mid);
    height: 14px;
    opacity: 0;
    transition: opacity 0.25s;
  }

  .copy-tip.show { opacity: 1; }

  /* 分隔线 */
  hr {
    border: none;
    border-top: 1px solid var(--border);
  }

  /* 进度 */
  .progress-row {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .progress-meta {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    color: var(--mid);
    letter-spacing: 0.1em;
  }

  .bar {
    width: 100%;
    height: 2px;
    background: var(--border);
  }

  .bar-fill {
    height: 100%;
    background: var(--fg);
    transition: width 1s linear;
  }

  /* 明天 */
  .tomorrow-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .tmr-label {
    font-size: 11px;
    color: var(--mid);
    letter-spacing: 0.15em;
  }

  .tmr-key {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 22px;
    letter-spacing: 0.08em;
    color: var(--mid);
    filter: blur(5px);
    transition: filter 0.3s, color 0.3s;
    cursor: pointer;
  }

  .tmr-key:hover {
    filter: blur(0);
    color: var(--fg);
  }

  /* 底部 */
  .bottom {
    display: flex;
    justify-content: space-between;
    margin-top: 6px;
    font-size: 10px;
    color: #bbb;
    letter-spacing: 0.12em;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <span class="site-title">HOTSPOT // KEY</span>
    <span class="clock" id="clock">——</span>
  </div>

  <div class="card">
    <div class="key-wrap">
      <div class="key-label">TODAY</div>
      <div class="key" id="key" onclick="copyKey()">——</div>
      <div class="copy-tip" id="tip">COPIED</div>
    </div>

    <hr>

    <div class="progress-row">
      <div class="progress-meta">
        <span>NEXT UPDATE</span>
        <span id="countdown">——</span>
      </div>
      <div class="bar"><div class="bar-fill" id="fill" style="width:0%"></div></div>
    </div>

    <div class="tomorrow-row">
      <span class="tmr-label">TOMORROW</span>
      <span class="tmr-key" id="tmr">——</span>
    </div>
  </div>

  <div class="bottom">
    <span>PRIME · 97</span>
    <span id="ts">——</span>
  </div>
</div>

<script>
  const PRIME = 97;

  function ts6am(d = 0) {
    const now = new Date();
    now.setDate(now.getDate() + d);
    return Math.floor(new Date(now.getFullYear(), now.getMonth(), now.getDate(), 6, 0, 0).getTime() / 1000);
  }

  function key(d = 0) { return String(Math.floor(ts6am(d) / PRIME)); }

  function p2(n) { return String(n).padStart(2, '0'); }

  function tick() {
    const now = new Date();
    document.getElementById('clock').textContent =
      `${p2(now.getHours())}:${p2(now.getMinutes())}:${p2(now.getSeconds())}`;
    document.getElementById('key').textContent = key(0);
    document.getElementById('tmr').textContent = key(1);
    document.getElementById('ts').textContent = `TS · ${ts6am(0)}`;

    const next6 = new Date(now.getFullYear(), now.getMonth(), now.getDate() + (now.getHours() >= 6 ? 1 : 0), 6, 0, 0);
    const diff = Math.max(0, Math.floor((next6 - now) / 1000));
    document.getElementById('countdown').textContent =
      `${p2(Math.floor(diff/3600))}:${p2(Math.floor(diff%3600/60))}:${p2(diff%60)}`;

    const dayElapsed = (now - new Date(now.getFullYear(), now.getMonth(), now.getDate())) / 86400000;
    document.getElementById('fill').style.width = (dayElapsed * 100) + '%';
  }

  function copyKey() {
    navigator.clipboard.writeText(document.getElementById('key').textContent).then(() => {
      const t = document.getElementById('tip');
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 1800);
    });
  }

  tick();
  setInterval(tick, 1000);
</script>
</body>
</html>
