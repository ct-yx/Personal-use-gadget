function renderTools(filter = 'all') {
  const grid = document.getElementById('toolGrid');
  const filtered = filter === 'all' ? tools : tools.filter(t => t.filter === filter);
  grid.innerHTML = filtered.map(t => `
    <div class="tool-card ${['pdf-merger','xapk-apk-converter','hotspot-key'].includes(t.id) ? 'featured' : ''}" data-filter="${t.filter}" data-id="${t.id}">
      <div class="tool-card-topline"><span>${String(i + 1).padStart(2,'0')}</span><em>${t.filter}</em></div>
      <div class="tool-card-icon" style="background:${t.iconBg}">${t.icon}</div>
      <div class="tool-card-title">${t.title}</div>
      <div class="tool-card-desc">${t.desc}</div>
      <div class="tool-card-footer">
        <div class="tool-tags">
          ${t.tags.map(tag => `<span class="tool-tag">${tag}</span>`).join('')}
        </div>
        <a href="${t.file}" class="tool-btn" target="_blank" onclick="event.stopPropagation()">
          打开 <span class="tool-btn-arrow">→</span>
        </a>
      </div>
    </div>
  `).join('');

  // 点击整个卡片也能打开
  document.querySelectorAll('.tool-card').forEach((card, i) => {
    card.addEventListener('click', () => {
      const btn = card.querySelector('.tool-btn');
      if (btn) window.open(btn.href, '_blank');
    });
  });
}

// 过滤切换
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderTools(btn.dataset.filter);
  });
});


// 首页轻量视差：只更新 CSS 变量，避免频繁 DOM 操作
if (document.body.classList.contains('page-home')) {
  let raf = 0;
  window.addEventListener('pointermove', (e) => {
    if (raf) return;
    raf = requestAnimationFrame(() => {
      const x = (e.clientX / innerWidth - 0.5) * 24;
      const y = (e.clientY / innerHeight - 0.5) * 18;
      document.documentElement.style.setProperty('--home-mx', x.toFixed(1) + 'px');
      document.documentElement.style.setProperty('--home-my', y.toFixed(1) + 'px');
      raf = 0;
    });
  }, { passive: true });
}

// 重新触发卡片动画
renderTools();
</script>
